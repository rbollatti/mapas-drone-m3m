[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "m3m"
version = "0.1.0"
description = "Orthomosaics, vegetation indices, DSM and point cloud from a DJI Mavic 3M, with free and open-source software (OpenDroneMap via Docker)"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "R. Bollatti" }]

[project.optional-dependencies]
# interfaz web local (python -m m3m.servidor); el pipeline CLI no la necesita
ui = ["fastapi>=0.110", "uvicorn>=0.27"]

[tool.setuptools]
packages = ["m3m"]
