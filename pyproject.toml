[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "m3m"
version = "0.1.0"
description = "Orthomosaics, vegetation indices, DSM and point cloud from a DJI Mavic 3M, with free and open-source software (OpenDroneMap via Docker)"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Rodolfo Bollatti" }]

[tool.setuptools]
packages = ["m3m"]
